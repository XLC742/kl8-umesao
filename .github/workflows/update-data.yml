name: Update KL8 Data

on:
  schedule:
    # 每天北京时间 21:30 自动更新（开奖后）
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest data and update
        run: node fetch_and_update.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto update to $(date -u +%Y-%m-%d)"
          git push
